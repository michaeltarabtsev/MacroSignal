name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MacroSignal
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://macrosignal.streamlit.app
          echo " - App pinged successfully"
